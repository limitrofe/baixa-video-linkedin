<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Baixa Vídeo LinkedIn</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <span class="brand">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 3a1 1 0 0 1 1 1v8.586l2.293-2.293a1 1 0 0 1 1.414 1.414l-4 4a1 1 0 0 1-1.414 0l-4-4a1 1 0 1 1 1.414-1.414L11 12.586V4a1 1 0 0 1 1-1Zm-6 15a1 1 0 0 1 1-1h10a1 1 0 1 1 0 2H7a1 1 0 0 1-1-1Z"
          />
        </svg>
        Baixa Vídeo LinkedIn
      </span>
      <button id="toggle-settings" class="ghost" type="button" title="Ajustes">Ajustes</button>
    </header>

    <main>
      <section id="status" class="status">Procurando vídeo nesta aba…</section>

      <div id="results"></div>

      <form id="paste-form" class="paste">
        <label for="paste-input">Ou cole o link do post</label>
        <div class="paste-row">
          <input
            id="paste-input"
            type="text"
            inputmode="url"
            placeholder="https://www.linkedin.com/posts/…"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="submit" class="primary">Buscar</button>
        </div>
      </form>

      <section id="settings" class="settings" hidden>
        <label for="quality">Qualidade preferida</label>
        <select id="quality">
          <option value="best">Melhor disponível</option>
          <option value="1080p">1080p</option>
          <option value="720p">720p</option>
          <option value="540p">540p</option>
          <option value="480p">480p</option>
          <option value="360p">360p</option>
        </select>

        <label class="check">
          <input id="save-as" type="checkbox" />
          <span>Perguntar onde salvar</span>
        </label>
      </section>
    </main>

    <footer class="foot">
      Baixa direto do CDN do LinkedIn — nada passa por servidor de terceiros.
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
